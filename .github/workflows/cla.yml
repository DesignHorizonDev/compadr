name: CLA

# Collects the signatures of the contributor license agreement (CLA.md).
# tools/cla.mjs holds the rules.
#
# pull_request_target runs with a token that can write, so this workflow
# never runs the code of a pull request: it checks out the default branch
# only, without keeping the token, and reads the pull request through the
# API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla:
    name: Contributor license agreement
    # A comment runs the job only on a pull request, and only when it holds
    # the sentence of the signature (SENTENCE in tools/cla.mjs): another
    # comment never takes the group of the pull request.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      contains(github.event.comment.body, 'I have read the CLA of Compadr and I accept it.'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One run at a time per pull request, set on the job so that a skipped
    # run (a comment on an issue) takes no group. Two signatures on two pull
    # requests may write at the same time: the contents API refuses the stale
    # one, and tools/cla.mjs reads again and retries.
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/cla.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/tools/cla.mjs`)
            await run({ github, context })
