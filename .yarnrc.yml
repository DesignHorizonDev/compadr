compressionLevel: mixed

enableGlobalCache: true

# No package runs an install script, except those allowed by `dependenciesMeta`
# in the root package.json (esbuild). A compromised package cannot run code at
# install time, in CI or on a workstation.
enableScripts: false

nodeLinker: node-modules

# The audit of the CI ignores this advisory only (2026-11-17). picomatch 4.0.7,
# the latest version, has a ReDoS through repeated extglobs (high), with no
# patched version. Here it comes only through vite and vitest, which read the
# glob patterns of their own configuration, never a pattern from outside.
# Remove this entry once a patched picomatch is published.
npmAuditIgnoreAdvisories:
  - '1247710' # GHSA-fc5q-39xc-vjpf
